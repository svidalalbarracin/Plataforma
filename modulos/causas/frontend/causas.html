<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causas — Plataforma Memo</title>
  <script>if(localStorage.theme==='dark'||(!localStorage.theme&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')</script>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="css/causas.css">
</head>
<body class="has-sidebar">

<nav class="navbar">
  <a href="causas.html" class="navbar-brand">Causas</a>
  <div class="navbar-links">
    <a href="causas.html" class="active" data-nav="">Todas</a>
    <a href="#" data-nav="notificaciones">
      Notificaciones
      <span class="navbar-badge navbar-badge-danger" id="badge-notif">3</span>
    </a>
    <a href="#" data-nav="vencimientos">
      Vencimientos
      <span class="navbar-badge navbar-badge-warning" id="badge-venc">0</span>
    </a>
    <a href="#" data-nav="sin-movimiento">Sin movimiento</a>

    <div class="navbar-dropdown" id="dd-tipo">
      <button class="navbar-dropdown-toggle">
        Por tipo <span class="chevron">▾</span>
      </button>
      <div class="navbar-dropdown-menu">
        <button class="navbar-dropdown-item" data-nav="tipo-pjn">Poder Judicial</button>
        <button class="navbar-dropdown-item" data-nav="tipo-aduana">Aduanero</button>
        <button class="navbar-dropdown-item" data-nav="tipo-fisica">Carpetas físicas</button>
      </div>
    </div>

    <div class="navbar-dropdown" id="dd-estado">
      <button class="navbar-dropdown-toggle">
        Estado <span class="chevron">▾</span>
      </button>
      <div class="navbar-dropdown-menu">
        <button class="navbar-dropdown-item" data-nav="tramite">En trámite</button>
        <button class="navbar-dropdown-item" data-nav="cerrada">Cerradas</button>
        <button class="navbar-dropdown-item" data-nav="archivada">Archivadas</button>
      </div>
    </div>
  </div>
  <a href="/configuracion" class="btn-config" title="Configuración">⚙</a>
  <button class="btn-theme" id="btn-theme">☾</button>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title" id="titulo-seccion">Todas las causas</h1>
    <div class="flex gap-2">
      <button class="btn btn-ghost btn-sm" onclick="toast('Importación desde Google Sheets próximamente', 'info')">
        ↑ Importar desde Sheets
      </button>
      <button class="btn btn-ghost btn-sm" onclick="toast('Exportación próximamente', 'info')">
        ↓ Exportar
      </button>
      <button class="btn btn-primary" onclick="toast('Alta de causas próximamente', 'info')">
        + Nueva causa
      </button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total causas</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Notificaciones sin leer</div>
      <div class="stat-value is-danger" id="stat-notif">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Vencimientos próximos 7 días</div>
      <div class="stat-value is-warning" id="stat-venc">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Sin movimiento +30 días</div>
      <div class="stat-value is-muted" id="stat-sin-mov">—</div>
    </div>
  </div>

  <div class="card">
    <div class="quick-filters">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filtro="">Todas</button>
        <button class="filter-tab" data-filtro="tramite">En trámite</button>
        <button class="filter-tab" data-filtro="cerrada">Cerradas</button>
        <button class="filter-tab" data-filtro="vencimiento">Con vencimiento</button>
        <button class="filter-tab" data-filtro="sin-movimiento">Sin movimiento</button>
      </div>
      <div class="search-box">
        <input type="text" id="buscador" placeholder="Buscar por expediente o cliente…">
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Expediente</th>
            <th>Cliente / Carátula</th>
            <th>Tribunal</th>
            <th>Estado</th>
            <th>Último movimiento</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="causas-body">
          <tr><td colspan="6" class="empty">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/causas.js"></script>
<script src="/js/layout.js"></script>
<script>
  function toast(msg, tipo = 'success') {
    const el = document.createElement('div');
    el.className = `toast toast-${tipo}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  // ── Dropdowns ─────────────────────────────────────
  document.querySelectorAll('.navbar-dropdown').forEach(dd => {
    dd.querySelector('.navbar-dropdown-toggle').addEventListener('click', e => {
      e.stopPropagation();
      const isOpen = dd.classList.contains('open');
      document.querySelectorAll('.navbar-dropdown').forEach(d => d.classList.remove('open'));
      if (!isOpen) dd.classList.add('open');
    });
  });

  document.addEventListener('click', () => {
    document.querySelectorAll('.navbar-dropdown').forEach(d => d.classList.remove('open'));
  });

  // ── Navegación ────────────────────────────────────
  const TITULOS = {
    '':              'Todas las causas',
    'notificaciones':'Notificaciones',
    'vencimientos':  'Vencimientos próximos',
    'sin-movimiento':'Sin movimiento',
    'tipo-pjn':      'Poder Judicial',
    'tipo-aduana':   'Aduanero',
    'tipo-fisica':   'Carpetas físicas',
    'tramite':       'En trámite',
    'cerrada':       'Cerradas',
    'archivada':     'Archivadas',
  };

  const NAV_A_FILTROTAB = {
    '':              '',
    'notificaciones':'',
    'vencimientos':  'vencimiento',
    'sin-movimiento':'sin-movimiento',
    'tipo-pjn':      '',
    'tipo-aduana':   '',
    'tipo-fisica':   '',
    'tramite':       'tramite',
    'cerrada':       'cerrada',
    'archivada':     'cerrada',
  };

  const NAV_A_TIPO = {
    'tipo-pjn':    'PJN',
    'tipo-aduana': 'Aduana',
    'tipo-fisica': 'Fisica',
  };

  function aplicarNav(nav) {
    document.getElementById('titulo-seccion').textContent = TITULOS[nav] ?? 'Causas';

    // Actualizar estado activo en navbar-links
    document.querySelectorAll('.navbar-links [data-nav]').forEach(el => {
      el.classList.toggle('active', el.dataset.nav === nav);
    });
    document.querySelectorAll('.navbar-dropdown-item').forEach(el => {
      el.classList.toggle('active', el.dataset.nav === nav);
    });

    // Sincronizar filter-tabs
    const tabFiltro = NAV_A_FILTROTAB[nav] ?? '';
    document.querySelectorAll('.filter-tab').forEach(b => {
      b.classList.toggle('active', b.dataset.filtro === tabFiltro);
    });

    // Aplicar filtro
    const busqueda = (document.getElementById('buscador')?.value ?? '').trim();
    const tipoBuscado = NAV_A_TIPO[nav] ?? null;
    let resultado = filtrarCausas(CAUSAS, tabFiltro, busqueda);
    if (tipoBuscado) resultado = resultado.filter(c => c.tipo === tipoBuscado);
    renderTabla(resultado);

    document.querySelectorAll('.navbar-dropdown').forEach(d => d.classList.remove('open'));
  }

  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      aplicarNav(el.dataset.nav);
    });
  });

  // filter-tabs también actualizan el nav
  document.querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.navbar-links [data-nav]').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.navbar-dropdown-item').forEach(el => el.classList.remove('active'));
      const busqueda = (document.getElementById('buscador')?.value ?? '').trim();
      renderTabla(filtrarCausas(CAUSAS, btn.dataset.filtro, busqueda));
      document.getElementById('titulo-seccion').textContent =
        btn.dataset.filtro === '' ? 'Todas las causas' : btn.textContent.trim();
    });
  });

  document.getElementById('buscador').addEventListener('input', e => {
    const filtroActivo = document.querySelector('.filter-tab.active')?.dataset.filtro ?? '';
    renderTabla(filtrarCausas(CAUSAS, filtroActivo, e.target.value.trim()));
  });
</script>
</body>
</html>
