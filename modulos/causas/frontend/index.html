<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario — Causas</title>
  <script>if(localStorage.theme==='dark'||(!localStorage.theme&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')</script>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="css/causas.css">
</head>
<body class="has-sidebar">

<nav class="navbar">
  <a href="index.html" class="navbar-brand">Causas</a>
  <div class="navbar-links">
    <a href="index.html" class="active">Calendario</a>
    <a href="pendientes.html">Pendientes</a>
    <a href="notificaciones.html">
      Notificaciones
      <span class="navbar-badge navbar-badge-danger" id="badge-notif"></span>
    </a>
    <a href="causas.html">Causas</a>
  </div>
  <a href="/configuracion" class="btn-config" title="Configuración">⚙</a>
  <button class="btn-theme" id="btn-theme">☾</button>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Calendario</h1>
    <div class="flex gap-2 items-center">
      <div class="toggle-vista">
        <button class="toggle-btn active" id="btn-semanal" onclick="setVista('semanal')">Semana</button>
        <button class="toggle-btn" id="btn-mensual" onclick="setVista('mensual')">Mes</button>
      </div>
      <button class="btn btn-ghost btn-sm" id="btn-hoy" onclick="irHoy()">Hoy</button>
      <div class="nav-fecha">
        <button class="btn btn-ghost btn-sm btn-icon" id="btn-prev" onclick="navegar(-1)">‹</button>
        <span class="nav-label" id="nav-label"></span>
        <button class="btn btn-ghost btn-sm btn-icon" id="btn-next" onclick="navegar(1)">›</button>
      </div>
      <a href="pendientes.html" class="btn btn-primary btn-sm">+ Nuevo pendiente</a>
    </div>
  </div>

  <div class="leyenda">
    <span class="leyenda-item"><span class="leyenda-dot dot-pendiente"></span>Vencimiento</span>
  </div>

  <div id="cal-semanal" class="cal-wrapper">
    <div class="cal-semana" id="cal-semana-grid"></div>
  </div>

  <div id="cal-mensual" class="cal-wrapper" style="display:none">
    <div class="cal-mes-header" id="cal-mes-header"></div>
    <div class="cal-mes-grid" id="cal-mes-grid"></div>
  </div>
</div>

<script src="js/causas.js"></script>
<script src="/js/layout.js"></script>
<script>
  let CAUSAS     = [];
  let PENDIENTES = [];

  const DIAS_NOMBRE = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  const MESES_NOMBRE = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                        'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  let vista   = 'semanal';
  let anchorFecha = new Date();
  anchorFecha.setHours(0,0,0,0);

  function setVista(v) {
    vista = v;
    document.getElementById('btn-semanal').classList.toggle('active', v === 'semanal');
    document.getElementById('btn-mensual').classList.toggle('active', v === 'mensual');
    document.getElementById('cal-semanal').style.display = v === 'semanal' ? '' : 'none';
    document.getElementById('cal-mensual').style.display = v === 'mensual' ? '' : 'none';
    render();
  }

  function irHoy() {
    anchorFecha = new Date(); anchorFecha.setHours(0,0,0,0);
    render();
  }

  function navegar(dir) {
    if (vista === 'semanal') {
      anchorFecha = new Date(anchorFecha.getTime() + dir * 7 * 86400000);
    } else {
      anchorFecha = new Date(anchorFecha.getFullYear(), anchorFecha.getMonth() + dir, 1);
    }
    render();
  }

  function isoFecha(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function eventosDelDia(fechaIso) {
    return PENDIENTES
      .filter(p => !p.completado && p.fecha_limite === fechaIso)
      .map(p => ({ ...p, tipo: 'pendiente' }));
  }

  function htmlEvento(ev) {
    const expediente = ev.numero_expediente;
    const expLabel   = expediente ? `<span class="ev-causa">${expediente}</span>` : '';
    return `
      <div class="cal-evento ev-${ev.tipo}">
        <span class="ev-desc">${ev.descripcion}</span>
        ${expLabel}
      </div>`;
  }

  function renderSemanal() {
    const dow = anchorFecha.getDay();
    const lunes = new Date(anchorFecha.getTime() - ((dow === 0 ? 6 : dow - 1)) * 86400000);

    const dias = [];
    for (let i = 0; i < 7; i++) {
      dias.push(new Date(lunes.getTime() + i * 86400000));
    }

    const inicioStr = `${dias[0].getDate()} ${MESES_NOMBRE[dias[0].getMonth()].slice(0,3)}`;
    const finStr    = `${dias[6].getDate()} ${MESES_NOMBRE[dias[6].getMonth()].slice(0,3)} ${dias[6].getFullYear()}`;
    document.getElementById('nav-label').textContent = `${inicioStr} – ${finStr}`;

    const hoyIso = isoFecha(new Date());
    const grid = document.getElementById('cal-semana-grid');
    grid.innerHTML = dias.map(d => {
      const iso    = isoFecha(d);
      const esHoy  = iso === hoyIso;
      const esFinde = d.getDay() === 0 || d.getDay() === 6;
      const eventos = eventosDelDia(iso);
      return `
        <div class="cal-dia-col ${esHoy ? 'es-hoy' : ''} ${esFinde ? 'es-finde' : ''}">
          <div class="cal-dia-header">
            <span class="cal-dia-nombre">${DIAS_NOMBRE[d.getDay()]}</span>
            <span class="cal-dia-num ${esHoy ? 'hoy-num' : ''}">${d.getDate()}</span>
          </div>
          <div class="cal-dia-eventos">
            ${eventos.length ? eventos.map(htmlEvento).join('') : ''}
          </div>
        </div>`;
    }).join('');
  }

  function renderMensual() {
    const year  = anchorFecha.getFullYear();
    const month = anchorFecha.getMonth();
    document.getElementById('nav-label').textContent = `${MESES_NOMBRE[month]} ${year}`;

    const header = document.getElementById('cal-mes-header');
    const DIAS_MES = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
    header.innerHTML = DIAS_MES.map(n => `<div class="cal-mes-dia-nombre">${n}</div>`).join('');

    const primerDia = new Date(year, month, 1);
    const ultimoDia = new Date(year, month + 1, 0);
    const inicioOffset = (primerDia.getDay() + 6) % 7; // lunes=0

    const hoyIso = isoFecha(new Date());
    const celdas = [];

    for (let i = 0; i < inicioOffset; i++) celdas.push('<div class="cal-mes-celda vacia"></div>');

    for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
      const d      = new Date(year, month, dia);
      const iso    = isoFecha(d);
      const esHoy  = iso === hoyIso;
      const esFinde = d.getDay() === 0 || d.getDay() === 6;
      const eventos = eventosDelDia(iso);
      celdas.push(`
        <div class="cal-mes-celda ${esHoy ? 'es-hoy' : ''} ${esFinde ? 'es-finde' : ''}">
          <div class="cal-mes-num ${esHoy ? 'hoy-num' : ''}">${dia}</div>
          <div class="cal-mes-eventos">
            ${eventos.map(htmlEvento).join('')}
          </div>
        </div>`);
    }

    document.getElementById('cal-mes-grid').innerHTML = celdas.join('');
  }

  function render() {
    if (vista === 'semanal') renderSemanal();
    else renderMensual();
  }

  async function cargarPendientes() {
    try {
      PENDIENTES = await fetch('/api/causas/pendientes?estado=pendiente').then(r => r.json());
      render();
    } catch {
      render();
    }
  }

  cargarPendientes();
</script>
</body>
</html>
