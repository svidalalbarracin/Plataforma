<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de causa — Plataforma Memo</title>
  <script>if(localStorage.theme==='dark'||(!localStorage.theme&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')</script>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="css/causas.css">
</head>
<body class="has-sidebar">

<nav class="navbar">
  <a href="index.html" class="navbar-brand">Causas</a>
  <div class="navbar-links">
    <a href="index.html">Calendario</a>
    <a href="pendientes.html">Pendientes</a>
    <a href="notificaciones.html">
      Notificaciones
      <span class="navbar-badge navbar-badge-danger" id="badge-notif"></span>
    </a>
    <a href="causas.html" class="active">Causas</a>
  </div>
  <a href="/configuracion" class="btn-config" title="Configuración">⚙</a>
  <button class="btn-theme" id="btn-theme">☾</button>
</nav>

<div class="container" id="contenido">
  <div class="empty" style="padding:4rem 0">Cargando…</div>
</div>

<!-- Modal: Editar causa -->
<div class="modal-backdrop" id="modal-editar">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <span class="modal-title">Editar causa</span>
      <button class="modal-close" onclick="cerrarModal('modal-editar')">×</button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label for="e-expediente">Nro. expediente</label>
        <input type="text" id="e-expediente">
      </div>
      <div class="form-group">
        <label for="e-tipo">Tipo</label>
        <select id="e-tipo">
          <option value="pjn">Poder Judicial (PJN)</option>
          <option value="tad">TAD</option>
          <option value="sicnea">SICNEA / Aduanero</option>
          <option value="aduanero">Aduanero (papel)</option>
          <option value="papel">Carpeta física</option>
        </select>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label for="e-caratula">Carátula</label>
        <input type="text" id="e-caratula">
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label for="e-juzgado">Tribunal / Juzgado</label>
        <input type="text" id="e-juzgado">
      </div>
      <div class="form-group">
        <label for="e-estado">Estado</label>
        <select id="e-estado">
          <option value="en_tramite">En trámite</option>
          <option value="archivada">Archivada</option>
          <option value="cerrada">Cerrada</option>
        </select>
      </div>
      <div class="form-group">
        <label for="e-fecha">Fecha de inicio</label>
        <input type="date" id="e-fecha">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal('modal-editar')">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar-editar">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- Modal: Vincular cliente -->
<div class="modal-backdrop" id="modal-cliente">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <span class="modal-title">Vincular cliente</span>
      <button class="modal-close" onclick="cerrarModal('modal-cliente')">×</button>
    </div>

    <div class="filter-tabs" style="margin-bottom:1.25rem">
      <button class="filter-tab active" id="tab-cli-existente" onclick="tabCliente('existente')">Existente</button>
      <button class="filter-tab" id="tab-cli-nuevo" onclick="tabCliente('nuevo')">Crear nuevo</button>
    </div>

    <div id="panel-cli-existente">
      <div class="form-group">
        <label for="sel-cliente">Cliente</label>
        <select id="sel-cliente" style="width:100%">
          <option value="">Seleccioná un cliente…</option>
        </select>
      </div>
    </div>

    <div id="panel-cli-nuevo" style="display:none">
      <div class="form-group">
        <label for="cli-nombre">Nombre / Razón social <span style="color:var(--danger)">*</span></label>
        <input type="text" id="cli-nombre" placeholder="Ej: García, Juan Carlos">
      </div>
      <div class="form-group">
        <label for="cli-cuit">CUIT <span class="text-muted" style="font-weight:400">(opcional)</span></label>
        <input type="text" id="cli-cuit" placeholder="20-12345678-9">
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal('modal-cliente')">Cancelar</button>
      <button class="btn btn-primary" id="btn-vincular-cliente">Vincular</button>
    </div>
  </div>
</div>

<script src="js/causas.js"></script>
<script src="/js/layout.js"></script>
<script>
  let CAUSA    = null;
  let CAUSA_ID = null;

  // ── Utils ──────────────────────────────────────────
  function toast(msg, tipo = 'success') {
    const el = document.createElement('div');
    el.className = `toast toast-${tipo}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function abrirModal(id) { document.getElementById(id).classList.add('open'); }
  function cerrarModal(id) { document.getElementById(id).classList.remove('open'); }

  document.querySelectorAll('.modal-backdrop').forEach(b => {
    b.addEventListener('click', e => { if (e.target === b) b.classList.remove('open'); });
  });

  function escHtml(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function subtractDays(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() - n);
    return d.toISOString().slice(0, 10);
  }

  // ── Render ─────────────────────────────────────────
  function renderPagina(causa) {
    CAUSA = causa;
    document.title = `${causa.numero_expediente ?? 'Causa'} — Causas`;

    const timeline = buildTimeline(causa);

    const html = `
      <div class="page-header" style="margin-bottom:1rem">
        <div class="flex items-center gap-2 flex-wrap">
          <a href="causas.html" class="btn btn-ghost btn-sm">← Volver</a>
          <h1 class="page-title">${escHtml(causa.numero_expediente ?? 'Sin expediente')}</h1>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="abrirEditar()">Editar</button>
      </div>

      <div class="causa-header">
        <div class="causa-header-left">
          <div class="causa-expediente">
            ${escHtml(causa.numero_expediente ?? '—')}
            ${tipoBadge(causa.tipo)}
          </div>
          <div class="causa-caratula">${escHtml(causa.caratula ?? '—')}</div>
        </div>
        <div>${estadoBadge(causa)}</div>
      </div>

      <!-- Datos principales -->
      <div class="card">
        <div class="card-title">Datos principales</div>
        <dl class="detail-grid">
          <div class="detail-item"><dt>Tipo</dt><dd>${tipoLabel(causa.tipo)}</dd></div>
          <div class="detail-item"><dt>Estado</dt><dd>${estadoLabel(causa.estado)}</dd></div>
          <div class="detail-item"><dt>Tribunal / Juzgado</dt><dd>${escHtml(causa.juzgado ?? '—')}</dd></div>
          <div class="detail-item"><dt>Fecha de inicio</dt><dd>${formatFecha(causa.fecha_inicio)}</dd></div>
        </dl>
      </div>

      <!-- Clientes -->
      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom:1.25rem">
          <div class="card-title" style="margin-bottom:0">Clientes</div>
          <button class="btn btn-ghost btn-sm" onclick="abrirModalCliente()">+ Vincular</button>
        </div>
        <div id="clientes-lista">
          ${causa.clientes?.length
            ? causa.clientes.map(cl => `
              <div class="flex justify-between items-center" style="padding:.6rem 0;border-bottom:1px solid var(--border)">
                <div>
                  <div style="font-weight:500">${escHtml(cl.nombre)}</div>
                  <div class="text-muted font-mono" style="font-size:.8rem">${escHtml(cl.cuit ?? '')}</div>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="desvincularCliente(${cl.id})" title="Desvincular">&#x2715;</button>
              </div>`).join('')
            : '<div class="empty" style="padding:1.5rem 0">Sin clientes vinculados</div>'
          }
        </div>
      </div>

      <!-- Actividad unificada -->
      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom:1.25rem">
          <div class="card-title" style="margin-bottom:0">Actividad</div>
          <div style="display:flex;gap:.4rem;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="abrirNotaForm()">+ Nota</button>
            <button class="btn btn-ghost btn-sm" onclick="abrirTareaForm()">+ Tarea</button>
            <button class="btn btn-ghost btn-sm" onclick="vincularNotificaciones()">Vincular auto.</button>
          </div>
        </div>

        <div id="nota-form-inline" class="tl-inline-form" style="display:none">
          <textarea id="nota-texto-new" placeholder="Escribí tu nota…" style="min-height:72px"></textarea>
          <div class="tl-inline-actions">
            <input type="date" id="nota-fecha-new" class="tl-date-field">
            <button class="btn btn-ghost btn-sm" onclick="cancelarNota()">Cancelar</button>
            <button class="btn btn-primary btn-sm" onclick="guardarNota()">Guardar nota</button>
          </div>
        </div>

        <div id="tarea-form-inline" class="tl-inline-form" style="display:none">
          <input type="text" id="tarea-desc-new" placeholder="Descripción de la tarea…" style="margin-bottom:.5rem">
          <div class="tl-inline-actions">
            <div style="margin-right:auto;display:flex;align-items:center;gap:.375rem;flex-wrap:wrap">
              <label style="font-size:.75rem;font-weight:600;white-space:nowrap">Fecha límite</label>
              <input type="date" id="tarea-fecha-new" class="tl-date-field" style="width:auto">
            </div>
            <button class="btn btn-ghost btn-sm" onclick="cancelarTarea()">Cancelar</button>
            <button class="btn btn-primary btn-sm" onclick="guardarTarea()">Guardar tarea</button>
          </div>
        </div>

        <div id="tl-lista">
          ${timeline.length
            ? timeline.map(htmlTimelineItem).join('')
            : '<div class="empty" style="padding:1.5rem 0">Sin actividad registrada. Usá <strong>Vincular auto.</strong> para buscar notificaciones existentes por número de expediente.</div>'
          }
        </div>
      </div>
    `;

    document.getElementById('contenido').innerHTML = html;
  }

  // ── Timeline ───────────────────────────────────────
  function buildTimeline(causa) {
    const items = [];

    for (const n of causa.notif_pjn ?? []) {
      items.push({
        tipo: 'pjn', id: n.id,
        fecha: n.fecha_envio,
        titulo: n.caratula || n.numero_expediente || `Notificación ${n.numero}`,
        sub: n.autor ? `De: ${n.autor}` : null,
        docUrl: n.archivo_path ? `/api/causas/biblioteca/notif-doc/pjn/${n.id}` : null,
      });
    }

    for (const n of causa.notif_tad ?? []) {
      items.push({
        tipo: 'tad', id: n.id,
        fecha: n.fecha,
        titulo: n.nombre || n.numero_tramite,
        sub: n.mensaje ? (n.mensaje.length > 120 ? n.mensaje.slice(0, 120) + '…' : n.mensaje) : null,
        docUrl: n.archivo_path ? `/api/causas/biblioteca/notif-doc/tad/${n.id}` : null,
      });
    }

    for (const n of causa.notif_sicnea ?? []) {
      items.push({
        tipo: 'sicnea', id: n.id,
        fecha: n.fecha_alta,
        titulo: n.motivo || `Cédula ${n.numero}`,
        sub: n.aduana ? `Aduana: ${n.aduana}` : null,
        docUrl: n.archivos_paths ? `/api/causas/biblioteca/notif-doc/sicnea/${n.id}` : null,
      });
    }

    for (const p of causa.pendientes ?? []) {
      items.push({
        tipo: 'pendiente', id: p.id,
        fecha: p.fecha_limite,
        titulo: p.descripcion,
        completado: !!p.completado,
        nota: p.nota,
      });
    }

    for (const n of causa.causa_notas ?? []) {
      items.push({
        tipo: 'nota', id: n.id,
        fecha: n.fecha,
        titulo: n.texto,
      });
    }

    items.sort((a, b) => (b.fecha ?? '').localeCompare(a.fecha ?? ''));

    return items;
  }

  function htmlTimelineItem(item) {
    const fecha = item.fecha ? formatFecha(item.fecha) : '—';

    if (item.tipo === 'nota') {
      return `
        <div class="tl-item" data-nota-id="${item.id}">
          <div class="tl-marker tl-marker-nota">&#x270E;</div>
          <div class="tl-body">
            <div class="tl-fecha">${fecha} &middot; Nota</div>
            <div class="tl-desc">${escHtml(item.titulo)}</div>
            <div class="tl-acciones">
              <button class="btn btn-ghost btn-sm" onclick="editarNota(${item.id})">Editar</button>
              <button class="btn btn-ghost btn-sm" onclick="eliminarNota(${item.id})">Eliminar</button>
            </div>
          </div>
        </div>`;
    }

    if (item.tipo === 'pendiente') {
      const markerCls = item.completado ? 'tl-marker-pend-ok' : 'tl-marker-pend';
      const markerTxt = item.completado ? '&#x2713;' : '';
      const descCls   = item.completado ? 'tl-desc tachado' : 'tl-desc';
      const estadoTxt = item.completado ? ' &middot; completada' : '';
      return `
        <div class="tl-item" data-pend-id="${item.id}">
          <div class="tl-marker ${markerCls}">${markerTxt}</div>
          <div class="tl-body">
            <div class="tl-fecha">${fecha} &middot; Tarea${estadoTxt}</div>
            <div class="${descCls}">${escHtml(item.titulo)}</div>
            ${item.nota ? `<div class="tl-sub">${escHtml(item.nota)}</div>` : ''}
            <div class="tl-acciones">
              <button class="btn btn-ghost btn-sm" onclick="togglePendiente(${item.id}, ${item.completado})">
                ${item.completado ? 'Reabrir' : '&#x2713; Completar'}
              </button>
              <button class="btn btn-ghost btn-sm" onclick="eliminarPendiente(${item.id})">Eliminar</button>
            </div>
          </div>
        </div>`;
    }

    // Notificación PJN / TAD / SICNEA
    const badgeCls = item.tipo === 'pjn' ? 'badge-tipo-pjn' : item.tipo === 'tad' ? 'badge-tipo-tad' : 'badge-tipo-sicnea';
    return `
      <div class="tl-item">
        <div class="tl-marker tl-marker-${item.tipo}"></div>
        <div class="tl-body">
          <div class="tl-fecha">
            <span class="badge badge-tipo ${badgeCls}">${item.tipo.toUpperCase()}</span>
            ${fecha}
          </div>
          <div class="tl-desc">${escHtml(item.titulo)}</div>
          ${item.sub ? `<div class="tl-sub">${escHtml(item.sub)}</div>` : ''}
          ${item.docUrl ? `<div class="tl-acciones"><a href="${item.docUrl}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Ver doc</a></div>` : ''}
        </div>
      </div>`;
  }

  // ── Editar causa ───────────────────────────────────
  function abrirEditar() {
    if (!CAUSA) return;
    document.getElementById('e-expediente').value = CAUSA.numero_expediente ?? '';
    document.getElementById('e-caratula').value   = CAUSA.caratula ?? '';
    document.getElementById('e-tipo').value       = CAUSA.tipo ?? 'pjn';
    document.getElementById('e-estado').value     = CAUSA.estado ?? 'en_tramite';
    document.getElementById('e-juzgado').value    = CAUSA.juzgado ?? '';
    document.getElementById('e-fecha').value      = CAUSA.fecha_inicio ?? '';
    abrirModal('modal-editar');
  }

  document.getElementById('btn-guardar-editar').addEventListener('click', async () => {
    const btn = document.getElementById('btn-guardar-editar');
    btn.disabled = true;
    try {
      const res = await fetch(`/api/causas/biblioteca/${CAUSA_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          numero_expediente: document.getElementById('e-expediente').value.trim() || null,
          caratula:     document.getElementById('e-caratula').value.trim()   || null,
          tipo:         document.getElementById('e-tipo').value,
          estado:       document.getElementById('e-estado').value,
          juzgado:      document.getElementById('e-juzgado').value.trim()    || null,
          fecha_inicio: document.getElementById('e-fecha').value || null,
        }),
      });
      if (!res.ok) throw new Error(await res.text());
      cerrarModal('modal-editar');
      toast('Causa actualizada');
      cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  // ── Notas manuales ─────────────────────────────────
  function abrirNotaForm() {
    document.getElementById('nota-fecha-new').value         = new Date().toLocaleDateString('sv');
    document.getElementById('nota-texto-new').value         = '';
    document.getElementById('nota-form-inline').style.display  = '';
    document.getElementById('tarea-form-inline').style.display = 'none';
    document.getElementById('nota-texto-new').focus();
  }

  function cancelarNota() {
    document.getElementById('nota-form-inline').style.display = 'none';
  }

  async function guardarNota() {
    const texto = document.getElementById('nota-texto-new').value.trim();
    const fecha = document.getElementById('nota-fecha-new').value;
    if (!texto) { toast('Escribí algo en la nota', 'error'); return; }
    try {
      const res = await fetch(`/api/causas/biblioteca/${CAUSA_ID}/notas`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto, fecha }),
      });
      if (!res.ok) throw new Error(await res.text());
      cancelarNota();
      toast('Nota guardada');
      cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  async function eliminarNota(notaId) {
    if (!confirm('¿Eliminar esta nota?')) return;
    try {
      const res = await fetch(`/api/causas/biblioteca/notas/${notaId}`, { method: 'DELETE' });
      if (!res.ok) throw new Error(await res.text());
      toast('Nota eliminada');
      cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  function editarNota(notaId) {
    const notaData = (CAUSA.causa_notas ?? []).find(n => n.id === notaId);
    if (!notaData) return;
    const item = document.querySelector(`.tl-item[data-nota-id="${notaId}"]`);
    if (!item) return;
    const body = item.querySelector('.tl-body');

    const ta = document.createElement('textarea');
    ta.style.cssText = 'width:100%;min-height:64px;resize:vertical;margin-top:.25rem;box-sizing:border-box';
    ta.value = notaData.texto;

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex;gap:.375rem;margin-top:.375rem;justify-content:flex-end';
    actions.innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="cargarCausa()">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="guardarEditNota(${notaId})">Guardar</button>`;

    body.innerHTML = `<div class="tl-fecha">${formatFecha(notaData.fecha)} &middot; Nota</div>`;
    body.appendChild(ta);
    body.appendChild(actions);
    ta.focus();
  }

  async function guardarEditNota(notaId) {
    const item  = document.querySelector(`.tl-item[data-nota-id="${notaId}"]`);
    const texto = item?.querySelector('textarea')?.value.trim();
    if (!texto) { toast('El texto no puede estar vacío', 'error'); return; }
    try {
      const res = await fetch(`/api/causas/biblioteca/notas/${notaId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto }),
      });
      if (!res.ok) throw new Error(await res.text());
      toast('Nota actualizada');
      cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  // ── Tareas (pendientes) ────────────────────────────
  function abrirTareaForm() {
    document.getElementById('tarea-fecha-new').value         = new Date().toLocaleDateString('sv');
    document.getElementById('tarea-desc-new').value          = '';
    document.getElementById('tarea-form-inline').style.display  = '';
    document.getElementById('nota-form-inline').style.display   = 'none';
    document.getElementById('tarea-desc-new').focus();
  }

  function cancelarTarea() {
    document.getElementById('tarea-form-inline').style.display = 'none';
  }

  async function guardarTarea() {
    const descripcion  = document.getElementById('tarea-desc-new').value.trim();
    const fecha_limite = document.getElementById('tarea-fecha-new').value;
    if (!descripcion)  { toast('Ingresá una descripción', 'error'); return; }
    if (!fecha_limite) { toast('Ingresá la fecha límite', 'error'); return; }
    const dias_aviso  = 3;
    const fecha_aviso = subtractDays(fecha_limite, dias_aviso);
    try {
      const res = await fetch('/api/causas/pendientes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ descripcion, causa_id: CAUSA_ID, fecha_limite, dias_aviso, fecha_aviso }),
      });
      if (!res.ok) throw new Error(await res.text());
      cancelarTarea();
      toast('Tarea guardada');
      cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  async function togglePendiente(pendienteId, completado) {
    try {
      const res = completado
        ? await fetch(`/api/causas/pendientes/${pendienteId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ completado: 0 }),
          })
        : await fetch(`/api/causas/pendientes/${pendienteId}/completar`, { method: 'PUT' });
      if (!res.ok) throw new Error(await res.text());
      cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  async function eliminarPendiente(pendienteId) {
    if (!confirm('¿Eliminar esta tarea?')) return;
    try {
      const res = await fetch(`/api/causas/pendientes/${pendienteId}`, { method: 'DELETE' });
      if (!res.ok) throw new Error(await res.text());
      toast('Tarea eliminada');
      cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  // ── Clientes ───────────────────────────────────────
  let tabClienteActiva = 'existente';

  function tabCliente(tab) {
    tabClienteActiva = tab;
    document.getElementById('tab-cli-existente').classList.toggle('active', tab === 'existente');
    document.getElementById('tab-cli-nuevo').classList.toggle('active',     tab === 'nuevo');
    document.getElementById('panel-cli-existente').style.display = tab === 'existente' ? '' : 'none';
    document.getElementById('panel-cli-nuevo').style.display     = tab === 'nuevo'     ? '' : 'none';
  }

  async function abrirModalCliente() {
    tabCliente('existente');
    document.getElementById('cli-nombre').value = '';
    document.getElementById('cli-cuit').value   = '';
    const sel = document.getElementById('sel-cliente');
    sel.innerHTML = '<option value="">Cargando…</option>';
    abrirModal('modal-cliente');
    try {
      const clientes = await fetch('/api/causas/biblioteca/clientes').then(r => r.json());
      const yaVinculados = new Set((CAUSA?.clientes ?? []).map(c => c.id));
      sel.innerHTML = '<option value="">Seleccioná un cliente…</option>'
        + clientes
            .filter(c => c.id && !yaVinculados.has(c.id))
            .map(c => `<option value="${c.id}">${escHtml(c.nombre)}${c.cuit ? ` — ${c.cuit}` : ''}</option>`)
            .join('');
    } catch {
      sel.innerHTML = '<option value="">Error al cargar clientes</option>';
    }
  }

  document.getElementById('btn-vincular-cliente').addEventListener('click', async () => {
    const btn = document.getElementById('btn-vincular-cliente');
    let body;

    if (tabClienteActiva === 'nuevo') {
      const nombre = document.getElementById('cli-nombre').value.trim();
      if (!nombre) { toast('Ingresá el nombre del cliente', 'error'); return; }
      const cuit = document.getElementById('cli-cuit').value.trim();
      body = { nombre, cuit: cuit || null };
    } else {
      const cliente_id = document.getElementById('sel-cliente').value;
      if (!cliente_id) { toast('Seleccioná un cliente', 'error'); return; }
      body = { cliente_id: Number(cliente_id) };
    }

    btn.disabled = true;
    try {
      const res = await fetch(`/api/causas/biblioteca/${CAUSA_ID}/clientes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(await res.text());
      cerrarModal('modal-cliente');
      toast('Cliente vinculado');
      cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  async function desvincularCliente(clienteId) {
    if (!confirm('¿Desvincular este cliente de la causa?')) return;
    try {
      const res = await fetch(`/api/causas/biblioteca/${CAUSA_ID}/clientes/${clienteId}`, { method: 'DELETE' });
      if (!res.ok) throw new Error(await res.text());
      toast('Cliente desvinculado');
      cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  // ── Auto-vincular notificaciones ───────────────────
  async function vincularNotificaciones() {
    try {
      const res  = await fetch(`/api/causas/biblioteca/${CAUSA_ID}/vincular-notif`, { method: 'POST' });
      const data = await res.json();
      const total = (data.vinculadas?.pjn ?? 0) + (data.vinculadas?.tad ?? 0) + (data.vinculadas?.sicnea ?? 0);
      toast(total ? `${total} notificación(es) vinculada(s)` : 'Sin coincidencias por expediente');
      if (total) cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  // ── Init ───────────────────────────────────────────
  async function cargarCausa() {
    try {
      const causa = await fetch(`/api/causas/biblioteca/${CAUSA_ID}`).then(r => {
        if (!r.ok) throw new Error('No encontrada');
        return r.json();
      });
      renderPagina(causa);
    } catch {
      document.getElementById('contenido').innerHTML =
        '<p class="empty" style="margin-top:3rem">Causa no encontrada. <a href="causas.html">Volver al listado</a></p>';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    CAUSA_ID = Number(new URLSearchParams(location.search).get('id'));
    if (!CAUSA_ID) {
      document.getElementById('contenido').innerHTML =
        '<p class="empty" style="margin-top:3rem">ID de causa inválido. <a href="causas.html">Volver</a></p>';
      return;
    }
    cargarCausa();
  });
</script>
</body>
</html>
