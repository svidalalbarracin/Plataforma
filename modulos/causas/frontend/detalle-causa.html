<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de causa — Plataforma Memo</title>
  <script>if(localStorage.theme==='dark'||(!localStorage.theme&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')</script>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="css/causas.css">
</head>
<body class="has-sidebar">

<nav class="navbar">
  <a href="causas.html" class="navbar-brand">Causas</a>
  <div class="navbar-links">
    <a href="causas.html">Todas</a>
    <a href="notificaciones.html">
      Notificaciones
      <span class="navbar-badge navbar-badge-danger" id="badge-notif"></span>
    </a>
  </div>
  <a href="/configuracion" class="btn-config" title="Configuración">⚙</a>
  <button class="btn-theme" id="btn-theme">☾</button>
</nav>

<div class="container" id="contenido">
  <div class="empty" style="padding:4rem 0">Cargando…</div>
</div>

<!-- Modal: Editar causa -->
<div class="modal-backdrop" id="modal-editar">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <span class="modal-title">Editar causa</span>
      <button class="modal-close" onclick="cerrarModal('modal-editar')">×</button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label for="e-expediente">Nro. expediente</label>
        <input type="text" id="e-expediente">
      </div>
      <div class="form-group">
        <label for="e-tipo">Tipo</label>
        <select id="e-tipo">
          <option value="pjn">Poder Judicial (PJN)</option>
          <option value="tad">TAD</option>
          <option value="sicnea">SICNEA / Aduanero</option>
          <option value="aduanero">Aduanero (papel)</option>
          <option value="papel">Carpeta física</option>
        </select>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label for="e-caratula">Carátula</label>
        <input type="text" id="e-caratula">
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label for="e-juzgado">Tribunal / Juzgado</label>
        <input type="text" id="e-juzgado">
      </div>
      <div class="form-group">
        <label for="e-estado">Estado</label>
        <select id="e-estado">
          <option value="en_tramite">En trámite</option>
          <option value="archivada">Archivada</option>
          <option value="cerrada">Cerrada</option>
        </select>
      </div>
      <div class="form-group">
        <label for="e-fecha">Fecha de inicio</label>
        <input type="date" id="e-fecha">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal('modal-editar')">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar-editar">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- Modal: Vincular cliente -->
<div class="modal-backdrop" id="modal-cliente">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <span class="modal-title">Vincular cliente</span>
      <button class="modal-close" onclick="cerrarModal('modal-cliente')">×</button>
    </div>
    <div class="form-group">
      <label for="sel-cliente">Cliente</label>
      <select id="sel-cliente" style="width:100%">
        <option value="">Seleccioná un cliente…</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal('modal-cliente')">Cancelar</button>
      <button class="btn btn-primary" id="btn-vincular-cliente">Vincular</button>
    </div>
  </div>
</div>

<script src="js/causas.js"></script>
<script src="/js/layout.js"></script>
<script>
  let CAUSA  = null;
  let CAUSA_ID = null;

  // ── Utils ──────────────────────────────────────────
  function toast(msg, tipo = 'success') {
    const el = document.createElement('div');
    el.className = `toast toast-${tipo}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function abrirModal(id) { document.getElementById(id).classList.add('open'); }
  function cerrarModal(id) { document.getElementById(id).classList.remove('open'); }

  document.querySelectorAll('.modal-backdrop').forEach(b => {
    b.addEventListener('click', e => { if (e.target === b) b.classList.remove('open'); });
  });

  // ── Render ─────────────────────────────────────────
  function renderPagina(causa) {
    CAUSA = causa;
    document.title = `${causa.numero_expediente ?? 'Causa'} — Causas`;

    // Movimientos: unificar notificaciones de los tres portales
    const movimientos = [
      ...(causa.notif_pjn ?? []).map(n => ({
        fecha:  n.fecha_envio,
        desc:   n.caratula || n.numero_expediente || `Notificación ${n.numero}`,
        detalle: n.autor ? `De: ${n.autor}` : null,
        origen: 'PJN',
        url:    null,
      })),
      ...(causa.notif_tad ?? []).map(n => ({
        fecha:  n.fecha,
        desc:   n.nombre || n.numero_tramite,
        detalle: n.mensaje ? (n.mensaje.length > 100 ? n.mensaje.slice(0, 100) + '…' : n.mensaje) : null,
        origen: 'TAD',
        url:    null,
      })),
      ...(causa.notif_sicnea ?? []).map(n => ({
        fecha:  n.fecha_alta,
        desc:   n.motivo || n.razon_social || `Cédula ${n.numero}`,
        detalle: n.aduana ? `Aduana: ${n.aduana}` : null,
        origen: 'SICNEA',
        url:    null,
      })),
    ].sort((a, b) => (b.fecha ?? '').localeCompare(a.fecha ?? ''));

    const html = `
      <div class="page-header" style="margin-bottom:1rem">
        <div class="flex items-center gap-2 flex-wrap">
          <a href="causas.html" class="btn btn-ghost btn-sm">← Volver</a>
          <h1 class="page-title">${causa.numero_expediente ?? 'Sin expediente'}</h1>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="abrirEditar()">Editar</button>
      </div>

      <div class="causa-header">
        <div class="causa-header-left">
          <div class="causa-expediente">
            ${causa.numero_expediente ?? '—'}
            ${tipoBadge(causa.tipo)}
          </div>
          <div class="causa-caratula">${causa.caratula ?? '—'}</div>
        </div>
        <div>${estadoBadge(causa)}</div>
      </div>

      <!-- Datos principales -->
      <div class="card">
        <div class="card-title">Datos principales</div>
        <dl class="detail-grid">
          <div class="detail-item"><dt>Tipo</dt><dd>${tipoLabel(causa.tipo)}</dd></div>
          <div class="detail-item"><dt>Estado</dt><dd>${estadoLabel(causa.estado)}</dd></div>
          <div class="detail-item"><dt>Tribunal / Juzgado</dt><dd>${causa.juzgado ?? '—'}</dd></div>
          <div class="detail-item"><dt>Fecha de inicio</dt><dd>${formatFecha(causa.fecha_inicio)}</dd></div>
        </dl>
      </div>

      <!-- Clientes -->
      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom:1.25rem">
          <div class="card-title" style="margin-bottom:0">Clientes</div>
          <button class="btn btn-ghost btn-sm" onclick="abrirModalCliente()">+ Vincular</button>
        </div>
        <div id="clientes-lista">
          ${causa.clientes?.length
            ? causa.clientes.map(cl => `
              <div class="flex justify-between items-center" style="padding:.6rem 0;border-bottom:1px solid var(--border)">
                <div>
                  <div style="font-weight:500">${cl.nombre}</div>
                  <div class="text-muted font-mono" style="font-size:.8rem">${cl.cuit ?? ''}</div>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="desvincularCliente(${cl.id})" title="Desvincular">✕</button>
              </div>`).join('')
            : '<div class="empty" style="padding:1.5rem 0">Sin clientes vinculados</div>'
          }
        </div>
      </div>

      <!-- Notificaciones / Movimientos -->
      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom:1.25rem">
          <div class="card-title" style="margin-bottom:0">Notificaciones vinculadas</div>
          <button class="btn btn-ghost btn-sm" onclick="vincularNotificaciones()">Vincular automático</button>
        </div>
        <ul class="movimientos-list" id="movimientos-list">
          ${movimientos.length
            ? movimientos.map(m => `
              <li class="movimiento-item">
                <div class="movimiento-fecha">${formatFecha(m.fecha)}</div>
                <div>
                  <div class="movimiento-desc">${m.desc}</div>
                  ${m.detalle ? `<div class="movimiento-origen">${m.detalle}</div>` : ''}
                  <div class="movimiento-origen" style="margin-top:.1rem">
                    <span class="badge badge-tipo ${m.origen === 'PJN' ? 'badge-tipo-pjn' : m.origen === 'TAD' ? 'badge-tipo-tad' : 'badge-tipo-sicnea'}" style="font-size:.65rem">${m.origen}</span>
                  </div>
                </div>
              </li>`).join('')
            : '<li class="empty" style="padding:1.5rem 0">Sin notificaciones vinculadas. Usá "Vincular automático" si hay notificaciones con el mismo número de expediente.</li>'
          }
        </ul>
      </div>

      <!-- Carpetas físicas -->
      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom:1.25rem">
          <div class="card-title" style="margin-bottom:0">Carpetas físicas</div>
          <button class="btn btn-ghost btn-sm" onclick="abrirModalCarpeta()">+ Agregar</button>
        </div>
        <div id="carpetas-lista">
          ${renderCarpetas(causa.carpetas ?? [])}
        </div>
      </div>

      <!-- Notas -->
      <div class="card">
        <div class="card-title">Notas</div>
        <textarea id="notas-textarea" placeholder="Anotá cualquier observación relevante de esta causa…" style="min-height:120px">${causa.notas ?? ''}</textarea>
        <div style="margin-top:.75rem;display:flex;justify-content:flex-end">
          <button class="btn btn-primary btn-sm" onclick="guardarNotas()">Guardar notas</button>
        </div>
      </div>
    `;

    document.getElementById('contenido').innerHTML = html;
  }

  function renderCarpetas(carpetas) {
    if (!carpetas.length) return '<div class="empty" style="padding:1.5rem 0">Sin carpetas físicas vinculadas</div>';
    return carpetas.map(c => `
      <div class="flex justify-between items-center" style="padding:.6rem 0;border-bottom:1px solid var(--border)">
        <div>
          ${c.numero ? `<div style="font-weight:500">Carpeta ${c.numero}</div>` : ''}
          ${c.ubicacion ? `<div class="text-muted" style="font-size:.875rem">${c.ubicacion}</div>` : ''}
          ${c.descripcion ? `<div class="text-muted" style="font-size:.8125rem;font-style:italic">${c.descripcion}</div>` : ''}
        </div>
        <button class="btn btn-ghost btn-sm" onclick="eliminarCarpeta(${c.id})" title="Eliminar">✕</button>
      </div>`).join('');
  }

  // ── Editar causa ───────────────────────────────────
  function abrirEditar() {
    if (!CAUSA) return;
    document.getElementById('e-expediente').value = CAUSA.numero_expediente ?? '';
    document.getElementById('e-caratula').value   = CAUSA.caratula ?? '';
    document.getElementById('e-tipo').value       = CAUSA.tipo ?? 'pjn';
    document.getElementById('e-estado').value     = CAUSA.estado ?? 'en_tramite';
    document.getElementById('e-juzgado').value    = CAUSA.juzgado ?? '';
    document.getElementById('e-fecha').value      = CAUSA.fecha_inicio ?? '';
    abrirModal('modal-editar');
  }

  document.getElementById('btn-guardar-editar').addEventListener('click', async () => {
    const btn = document.getElementById('btn-guardar-editar');
    btn.disabled = true;
    try {
      const res = await fetch(`/api/causas/biblioteca/${CAUSA_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          numero_expediente: document.getElementById('e-expediente').value.trim() || null,
          caratula:  document.getElementById('e-caratula').value.trim()  || null,
          tipo:      document.getElementById('e-tipo').value,
          estado:    document.getElementById('e-estado').value,
          juzgado:   document.getElementById('e-juzgado').value.trim()   || null,
          fecha_inicio: document.getElementById('e-fecha').value || null,
        }),
      });
      if (!res.ok) throw new Error(await res.text());
      cerrarModal('modal-editar');
      toast('Causa actualizada');
      cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  // ── Notas ──────────────────────────────────────────
  async function guardarNotas() {
    const notas = document.getElementById('notas-textarea')?.value ?? '';
    try {
      const res = await fetch(`/api/causas/biblioteca/${CAUSA_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notas }),
      });
      if (!res.ok) throw new Error(await res.text());
      toast('Notas guardadas');
    } catch (e) {
      toast('Error al guardar: ' + e.message, 'error');
    }
  }

  // ── Clientes ───────────────────────────────────────
  async function abrirModalCliente() {
    const sel = document.getElementById('sel-cliente');
    sel.innerHTML = '<option value="">Cargando…</option>';
    abrirModal('modal-cliente');
    try {
      const clientes = await fetch('/api/clientes').then(r => r.json());
      const yaVinculados = new Set((CAUSA?.clientes ?? []).map(c => c.id));
      sel.innerHTML = '<option value="">Seleccioná un cliente…</option>'
        + clientes
            .filter(c => !yaVinculados.has(c.id))
            .map(c => `<option value="${c.id}">${c.nombre}${c.cuit ? ` — ${c.cuit}` : ''}</option>`)
            .join('');
    } catch {
      sel.innerHTML = '<option value="">Error al cargar clientes</option>';
    }
  }

  document.getElementById('btn-vincular-cliente').addEventListener('click', async () => {
    const cliente_id = document.getElementById('sel-cliente').value;
    if (!cliente_id) { toast('Seleccioná un cliente', 'error'); return; }
    try {
      const res = await fetch(`/api/causas/biblioteca/${CAUSA_ID}/clientes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cliente_id: Number(cliente_id) }),
      });
      if (!res.ok) throw new Error(await res.text());
      cerrarModal('modal-cliente');
      toast('Cliente vinculado');
      cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  });

  async function desvincularCliente(clienteId) {
    if (!confirm('¿Desvincular este cliente de la causa?')) return;
    try {
      const res = await fetch(`/api/causas/biblioteca/${CAUSA_ID}/clientes/${clienteId}`, { method: 'DELETE' });
      if (!res.ok) throw new Error(await res.text());
      toast('Cliente desvinculado');
      cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  // ── Notificaciones auto-vincular ───────────────────
  async function vincularNotificaciones() {
    try {
      const res = await fetch(`/api/causas/biblioteca/${CAUSA_ID}/vincular-notif`, { method: 'POST' });
      const data = await res.json();
      const total = (data.vinculadas?.pjn ?? 0) + (data.vinculadas?.tad ?? 0) + (data.vinculadas?.sicnea ?? 0);
      toast(total ? `${total} notificación(es) vinculada(s)` : 'No se encontraron coincidencias por expediente');
      if (total) cargarCausa();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  // ── Carpetas ───────────────────────────────────────
  function abrirModalCarpeta() {
    const numero = prompt('Número de carpeta (opcional):') ?? '';
    const ubicacion = prompt('Ubicación (ej: Estante A / Caja 3):') ?? '';
    if (!numero && !ubicacion) return;
    fetch(`/api/causas/biblioteca/carpetas`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ causa_id: CAUSA_ID, numero: numero || null, ubicacion: ubicacion || null }),
    })
      .then(r => r.ok ? (toast('Carpeta agregada'), cargarCausa()) : Promise.reject())
      .catch(() => toast('Error al agregar carpeta', 'error'));
  }

  async function eliminarCarpeta(carpetaId) {
    if (!confirm('¿Eliminar esta carpeta?')) return;
    try {
      await fetch(`/api/causas/biblioteca/carpetas/${carpetaId}`, { method: 'DELETE' });
      toast('Carpeta eliminada');
      cargarCausa();
    } catch {
      toast('Error al eliminar', 'error');
    }
  }

  // ── Init ───────────────────────────────────────────
  async function cargarCausa() {
    try {
      const causa = await fetch(`/api/causas/biblioteca/${CAUSA_ID}`).then(r => {
        if (!r.ok) throw new Error('No encontrada');
        return r.json();
      });
      renderPagina(causa);
    } catch (e) {
      document.getElementById('contenido').innerHTML =
        `<p class="empty" style="margin-top:3rem">Causa no encontrada. <a href="causas.html">Volver al listado</a></p>`;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    CAUSA_ID = Number(new URLSearchParams(location.search).get('id'));
    if (!CAUSA_ID) {
      document.getElementById('contenido').innerHTML =
        '<p class="empty" style="margin-top:3rem">ID de causa inválido. <a href="causas.html">Volver</a></p>';
      return;
    }
    cargarCausa();
  });
</script>
</body>
</html>
