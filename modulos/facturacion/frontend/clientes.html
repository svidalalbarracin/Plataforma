<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Facturación</title>
  <script>if(localStorage.theme==='dark'||(!localStorage.theme&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')</script>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="has-sidebar">

<nav class="navbar">
  <a href="index.html" class="navbar-brand">Facturación</a>
  <div class="navbar-links">
    <a href="index.html">Dashboard</a>
    <a href="facturas.html">Facturas</a>
    <a href="clientes.html" class="active">Clientes</a>
  </div>
  <a href="/configuracion" class="btn-config" title="Configuración">⚙</a>
  <button class="btn-theme" id="btn-theme">☾</button>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Clientes</h1>
    <button class="btn btn-primary" id="btn-nuevo">+ Nuevo cliente</button>
  </div>

  <div class="card">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>CUIT</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="clientes-body">
          <tr><td colspan="5" class="empty">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal alta / edición -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-titulo">Nuevo cliente</h2>
      <button class="modal-close" id="btn-cerrar-modal" aria-label="Cerrar">&times;</button>
    </div>

    <form id="form-cliente">
      <div class="form-grid">
        <div class="form-group" style="grid-column: 1 / -1">
          <label for="c-nombre">Nombre / Razón social *</label>
          <input type="text" id="c-nombre" required placeholder="Empresa SA">
        </div>
        <div class="form-group">
          <label for="c-cuit">CUIT *</label>
          <input type="text" id="c-cuit" required placeholder="30-12345678-9">
        </div>
        <div class="form-group">
          <label for="c-email">Email</label>
          <input type="email" id="c-email" placeholder="contacto@empresa.com">
        </div>
        <div class="form-group">
          <label for="c-telefono">Teléfono</label>
          <input type="text" id="c-telefono" placeholder="011 1234-5678">
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
  let editandoId = null;

  function toast(msg, tipo = 'success') {
    const el = document.createElement('div');
    el.className = `toast toast-${tipo}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function abrirModal(cliente = null) {
    editandoId = cliente ? cliente.id : null;
    document.getElementById('modal-titulo').textContent = cliente ? 'Editar cliente' : 'Nuevo cliente';
    document.getElementById('c-nombre').value   = cliente?.nombre   ?? '';
    document.getElementById('c-cuit').value     = cliente?.cuit     ?? '';
    document.getElementById('c-email').value    = cliente?.email    ?? '';
    document.getElementById('c-telefono').value = cliente?.telefono ?? '';
    document.getElementById('modal-backdrop').classList.add('open');
    document.getElementById('c-nombre').focus();
  }

  function cerrarModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
    document.getElementById('form-cliente').reset();
    editandoId = null;
  }

  function renderTabla(clientes) {
    const tbody = document.getElementById('clientes-body');
    if (clientes.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">No hay clientes registrados</td></tr>';
      return;
    }
    tbody.innerHTML = clientes.map(c => `
      <tr>
        <td class="fw-bold">${c.nombre}</td>
        <td class="font-mono">${c.cuit}</td>
        <td class="text-muted">${c.email || '—'}</td>
        <td class="text-muted">${c.telefono || '—'}</td>
        <td>
          <div class="flex gap-1">
            <button class="btn btn-ghost btn-sm" data-action="editar" data-id="${c.id}">Editar</button>
            <button class="btn btn-danger btn-sm" data-action="eliminar" data-id="${c.id}">Eliminar</button>
          </div>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('[data-action="editar"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const cliente = await API.clientes.get(btn.dataset.id);
        abrirModal(cliente);
      });
    });

    tbody.querySelectorAll('[data-action="eliminar"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('¿Eliminar este cliente? Esta acción no se puede deshacer.')) return;
        try {
          await API.clientes.delete(btn.dataset.id);
          toast('Cliente eliminado');
          cargarClientes();
        } catch (e) { toast(e.message, 'error'); }
      });
    });
  }

  async function cargarClientes() {
    try {
      const clientes = await API.clientes.list();
      renderTabla(clientes);
    } catch (e) {
      document.getElementById('clientes-body').innerHTML =
        `<tr><td colspan="5" class="empty">Error al cargar datos: ${e.message}</td></tr>`;
    }
  }

  document.getElementById('btn-nuevo').addEventListener('click', () => abrirModal());
  document.getElementById('btn-cerrar-modal').addEventListener('click', cerrarModal);
  document.getElementById('btn-cancelar').addEventListener('click', cerrarModal);

  document.getElementById('modal-backdrop').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) cerrarModal();
  });

  document.getElementById('form-cliente').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-guardar');
    btn.disabled = true;

    const data = {
      nombre:   document.getElementById('c-nombre').value.trim(),
      cuit:     document.getElementById('c-cuit').value.trim(),
      email:    document.getElementById('c-email').value.trim() || null,
      telefono: document.getElementById('c-telefono').value.trim() || null,
    };

    try {
      if (editandoId) {
        await API.clientes.update(editandoId, data);
        toast('Cliente actualizado');
      } else {
        await API.clientes.create(data);
        toast('Cliente creado');
      }
      cerrarModal();
      cargarClientes();
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  cargarClientes();
</script>
</body>
</html>
