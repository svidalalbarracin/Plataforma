<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas — Facturación</title>
  <script>if(localStorage.theme==='dark'||(!localStorage.theme&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')</script>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    .stat-comp {
      font-size: .8125rem;
      margin-top: .35rem;
      font-weight: 500;
    }
    .comp-up      { color: var(--success); }
    .comp-down    { color: var(--danger); }
    .comp-neutral { color: var(--text-muted); }
    .comp-new     { color: var(--primary); }

    .stat-value-md {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
    }

    /* ── Tabs ── */
    .view-tabs {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.5rem;
    }
    .view-tab {
      padding: .45rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      cursor: pointer;
      font-size: .875rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: background .15s, color .15s, border-color .15s;
    }
    .view-tab:hover  { border-color: var(--primary); color: var(--primary-text); }
    .view-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ── Tabla anual ── */
    .anio-table tfoot td {
      font-weight: 700;
      background: var(--bg);
      border-top: 2px solid var(--border);
    }
    .anio-table tr.mes-vacio td { color: var(--text-muted); }
  </style>
</head>
<body class="has-sidebar">

<nav class="navbar">
  <a href="index.html" class="navbar-brand">Facturación</a>
  <div class="navbar-links">
    <a href="index.html">Dashboard</a>
    <a href="facturas.html">Facturas</a>
    <a href="clientes.html">Clientes</a>
    <a href="estadisticas.html" class="active">Estadísticas</a>
  </div>
  <a href="/configuracion" class="btn-config" title="Configuración">⚙</a>
  <button class="btn-theme" id="btn-theme">☾</button>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Estadísticas</h1>
  </div>

  <!-- Tabs -->
  <div class="view-tabs">
    <button class="view-tab active" data-tab="mensual">Mensual</button>
    <button class="view-tab"        data-tab="anual">Anual</button>
  </div>

  <!-- ══════════════════════════════════════════════════
       VISTA MENSUAL
  ══════════════════════════════════════════════════ -->
  <div id="seccion-mensual">

    <div class="card" style="padding:1rem 1.5rem">
      <div class="filters" style="border:none;margin:0;padding:0">
        <div class="filter-group">
          <label for="f-mes">Mes</label>
          <select id="f-mes">
            <option value="1">Enero</option><option value="2">Febrero</option>
            <option value="3">Marzo</option><option value="4">Abril</option>
            <option value="5">Mayo</option><option value="6">Junio</option>
            <option value="7">Julio</option><option value="8">Agosto</option>
            <option value="9">Septiembre</option><option value="10">Octubre</option>
            <option value="11">Noviembre</option><option value="12">Diciembre</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="f-anio">Año</label>
          <select id="f-anio" style="min-width:90px"></select>
        </div>
        <button class="btn btn-primary" id="btn-filtrar">Ver estadísticas</button>
      </div>
    </div>

    <div class="card-title" style="margin-bottom:.75rem" id="titulo-mes">Estadísticas del mes</div>

    <div class="stats-grid" id="stats-mes">
      <div class="stat-card"><div class="stat-label">Cargando…</div></div>
    </div>

    <div class="card" style="margin-top:1.5rem">
      <div class="card-title">Clientes con facturas pendientes de cobro</div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Cliente</th>
              <th>CUIT</th>
              <th class="text-right">Facturas</th>
              <th class="text-right">Monto pendiente</th>
            </tr>
          </thead>
          <tbody id="pendientes-body">
            <tr><td colspan="4" class="empty">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div><!-- /seccion-mensual -->

  <!-- ══════════════════════════════════════════════════
       VISTA ANUAL
  ══════════════════════════════════════════════════ -->
  <div id="seccion-anual" style="display:none">

    <div class="card" style="padding:1rem 1.5rem">
      <div class="filters" style="border:none;margin:0;padding:0">
        <div class="filter-group">
          <label for="f-anio-anual">Año</label>
          <select id="f-anio-anual" style="min-width:90px"></select>
        </div>
        <button class="btn btn-primary" id="btn-filtrar-anual">Ver año</button>
      </div>
    </div>

    <!-- Gráfico -->
    <div class="card">
      <div class="card-title" id="titulo-anual">Resumen anual</div>
      <canvas id="grafico-anual" height="90"></canvas>
    </div>

    <!-- Tabla mensual -->
    <div class="card">
      <div class="card-title">Detalle por mes</div>
      <div class="table-wrapper">
        <table class="anio-table">
          <thead>
            <tr>
              <th>Mes</th>
              <th class="text-right">Facturado</th>
              <th class="text-right">Cobrado</th>
              <th class="text-right">Retenciones</th>
              <th class="text-right">Emitidas</th>
              <th class="text-right">Cobradas</th>
              <th class="text-right">Pendientes</th>
            </tr>
          </thead>
          <tbody id="anual-body">
            <tr><td colspan="7" class="empty">Cargando…</td></tr>
          </tbody>
          <tfoot id="anual-foot"></tfoot>
        </table>
      </div>
    </div>

  </div><!-- /seccion-anual -->

</div>

<script src="js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
  const fmt    = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' });
  const fmtNum = n => new Intl.NumberFormat('es-AR').format(n);

  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                 'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  // ── Tabs ──────────────────────────────────────────────────────────────────

  document.querySelectorAll('.view-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.view-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('seccion-mensual').style.display = tab === 'mensual' ? '' : 'none';
      document.getElementById('seccion-anual').style.display   = tab === 'anual'   ? '' : 'none';
    });
  });

  // ── Comparativa ───────────────────────────────────────────────────────────

  function compMoney(actual, anterior) {
    if (anterior === 0 && actual === 0) return '<span class="comp-neutral">Sin datos del mes anterior</span>';
    if (anterior === 0) return '<span class="comp-new">Nuevo este mes</span>';
    const diff = actual - anterior;
    const pct  = Math.round((diff / anterior) * 100);
    const sign = diff >= 0 ? '+' : '';
    const cls  = diff >= 0 ? 'comp-up' : 'comp-down';
    const arr  = diff >= 0 ? '▲' : '▼';
    return `<span class="${cls}">${arr} ${sign}${fmt.format(diff)} (${sign}${pct}%)</span>`;
  }

  function compNum(actual, anterior) {
    if (anterior === 0 && actual === 0) return '<span class="comp-neutral">Sin datos del mes anterior</span>';
    if (anterior === 0) return '<span class="comp-new">Nuevo este mes</span>';
    const diff = actual - anterior;
    const pct  = Math.round((diff / anterior) * 100);
    const sign = diff >= 0 ? '+' : '';
    const cls  = diff >= 0 ? 'comp-up' : 'comp-down';
    const arr  = diff >= 0 ? '▲' : '▼';
    return `<span class="${cls}">${arr} ${sign}${diff} (${sign}${pct}%)</span>`;
  }

  // ── Vista mensual ─────────────────────────────────────────────────────────

  function renderStats({ actual, anterior }) {
    const cards = [
      { label: 'Total facturado',    value: fmt.format(actual.total_facturado),   comp: compMoney(actual.total_facturado,   anterior.total_facturado),   cls: 'is-primary' },
      { label: 'Total cobrado',      value: fmt.format(actual.total_cobrado),     comp: compMoney(actual.total_cobrado,     anterior.total_cobrado),     cls: 'is-primary' },
      { label: 'Total retenciones',  value: fmt.format(actual.total_retenciones), comp: compMoney(actual.total_retenciones, anterior.total_retenciones), cls: '' },
      { label: 'Facturas emitidas',  value: fmtNum(actual.total_facturas), comp: compNum(actual.total_facturas, anterior.total_facturas), cls: '',           small: true },
      { label: 'Facturas cobradas',  value: fmtNum(actual.cobradas),       comp: compNum(actual.cobradas,       anterior.cobradas),       cls: 'is-primary', small: true },
      { label: 'Facturas pendientes',value: fmtNum(actual.pendientes),     comp: compNum(actual.pendientes,     anterior.pendientes),     cls: actual.pendientes > 0 ? 'is-danger' : '', small: true },
    ];

    document.getElementById('stats-mes').innerHTML = cards.map(c => `
      <div class="stat-card">
        <div class="stat-label">${c.label}</div>
        <div class="${c.small ? 'stat-value-md' : 'stat-value'} ${c.cls}">${c.value}</div>
        <div class="stat-comp">${c.comp}</div>
      </div>
    `).join('');
  }

  function renderPendientes(rows) {
    const tbody = document.getElementById('pendientes-body');
    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">Sin facturas pendientes ✓</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td class="fw-bold">${r.nombre}</td>
        <td class="font-mono">${r.cuit}</td>
        <td class="text-right">${r.facturas_count}</td>
        <td class="text-right font-mono fw-bold">${fmt.format(r.monto_pendiente)}</td>
      </tr>
    `).join('');
  }

  async function cargarMensual() {
    const mes  = document.getElementById('f-mes').value;
    const anio = document.getElementById('f-anio').value;
    const nombreMes = new Date(anio, mes - 1).toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
    document.getElementById('titulo-mes').textContent = `Estadísticas — ${nombreMes}`;
    try {
      const [stats, pendientes] = await Promise.all([
        API.estadisticas.mes({ mes, anio }),
        API.estadisticas.clientesPendientes(),
      ]);
      renderStats(stats);
      renderPendientes(pendientes);
    } catch (e) {
      document.getElementById('stats-mes').innerHTML =
        `<div class="stat-card"><div class="stat-label" style="color:var(--danger)">Error: ${e.message}</div></div>`;
    }
  }

  // ── Vista anual ───────────────────────────────────────────────────────────

  let grafico = null;

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function renderGrafico(meses) {
    const labels  = MESES;
    const gridColor  = cssVar('--border');
    const labelColor = cssVar('--text-muted');

    const data = {
      labels,
      datasets: [
        {
          label: 'Facturado',
          data:  meses.map(m => m.total_facturado),
          backgroundColor: 'rgba(29,78,216,.75)',
          borderRadius: 4,
        },
        {
          label: 'Cobrado',
          data:  meses.map(m => m.total_cobrado),
          backgroundColor: 'rgba(22,163,74,.75)',
          borderRadius: 4,
        },
        {
          label: 'Retenciones',
          data:  meses.map(m => m.total_retenciones),
          backgroundColor: 'rgba(217,119,6,.75)',
          borderRadius: 4,
        },
      ],
    };

    if (grafico) {
      grafico.data = data;
      grafico.options.scales.x.ticks.color  = labelColor;
      grafico.options.scales.y.ticks.color  = labelColor;
      grafico.options.scales.y.grid.color   = gridColor;
      grafico.options.plugins.legend.labels.color = labelColor;
      grafico.update();
      return;
    }

    grafico = new Chart(document.getElementById('grafico-anual'), {
      type: 'bar',
      data,
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: labelColor, font: { size: 12 } } },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.dataset.label}: ${fmt.format(ctx.raw)}`,
            },
          },
        },
        scales: {
          x: {
            ticks: { color: labelColor, font: { size: 11 } },
            grid:  { display: false },
          },
          y: {
            ticks: {
              color: labelColor,
              font:  { size: 11 },
              callback: v => fmt.format(v),
            },
            grid: { color: gridColor },
          },
        },
      },
    });
  }

  function renderTablaAnual(meses) {
    const tot = (key) => meses.reduce((s, m) => s + m[key], 0);

    const tbody = document.getElementById('anual-body');
    tbody.innerHTML = meses.map(m => {
      const vacio = m.total_facturas === 0;
      return `
        <tr class="${vacio ? 'mes-vacio' : ''}">
          <td>${MESES[m.mes - 1]}</td>
          <td class="text-right font-mono">${vacio ? '—' : fmt.format(m.total_facturado)}</td>
          <td class="text-right font-mono">${vacio ? '—' : fmt.format(m.total_cobrado)}</td>
          <td class="text-right font-mono">${vacio ? '—' : fmt.format(m.total_retenciones)}</td>
          <td class="text-right">${vacio ? '—' : fmtNum(m.total_facturas)}</td>
          <td class="text-right">${vacio ? '—' : fmtNum(m.cobradas)}</td>
          <td class="text-right">${vacio ? '—' : fmtNum(m.pendientes)}</td>
        </tr>
      `;
    }).join('');

    document.getElementById('anual-foot').innerHTML = `
      <tr>
        <td>Total</td>
        <td class="text-right font-mono">${fmt.format(tot('total_facturado'))}</td>
        <td class="text-right font-mono">${fmt.format(tot('total_cobrado'))}</td>
        <td class="text-right font-mono">${fmt.format(tot('total_retenciones'))}</td>
        <td class="text-right">${fmtNum(tot('total_facturas'))}</td>
        <td class="text-right">${fmtNum(tot('cobradas'))}</td>
        <td class="text-right">${fmtNum(tot('pendientes'))}</td>
      </tr>
    `;
  }

  async function cargarAnual() {
    const anio = document.getElementById('f-anio-anual').value;
    document.getElementById('titulo-anual').textContent = `Resumen ${anio}`;
    try {
      const { meses } = await API.estadisticas.anio({ anio });
      renderGrafico(meses);
      renderTablaAnual(meses);
    } catch (e) {
      document.getElementById('anual-body').innerHTML =
        `<tr><td colspan="7" class="empty" style="color:var(--danger)">Error: ${e.message}</td></tr>`;
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────

  const hoy = new Date();

  // Selector de años mensual (año actual y 4 anteriores)
  const selAnio = document.getElementById('f-anio');
  for (let y = hoy.getFullYear(); y >= hoy.getFullYear() - 4; y--) {
    const o = document.createElement('option');
    o.value = y; o.textContent = y;
    selAnio.appendChild(o);
  }

  // Selector de años anual
  const selAnioAnual = document.getElementById('f-anio-anual');
  for (let y = hoy.getFullYear(); y >= hoy.getFullYear() - 4; y--) {
    const o = document.createElement('option');
    o.value = y; o.textContent = y;
    selAnioAnual.appendChild(o);
  }

  document.getElementById('f-mes').value = hoy.getMonth() + 1;

  document.getElementById('btn-filtrar').addEventListener('click', cargarMensual);
  document.getElementById('btn-filtrar-anual').addEventListener('click', cargarAnual);

  cargarMensual();
</script>
</body>
</html>
