<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Factura — Facturación</title>
  <script>if(localStorage.theme==='dark'||(!localStorage.theme&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')</script>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="has-sidebar">

<nav class="navbar">
  <a href="index.html" class="navbar-brand">Facturación</a>
  <div class="navbar-links">
    <a href="index.html">Dashboard</a>
    <a href="facturas.html" class="active">Facturas</a>
    <a href="clientes.html">Clientes</a>
    <a href="estadisticas.html">Estadísticas</a>
  </div>
  <a href="/configuracion" class="btn-config" title="Configuración">⚙</a>
  <button class="btn-theme" id="btn-theme">☾</button>
</nav>

<div class="container">
  <div class="page-header">
    <div class="flex items-center gap-2">
      <a href="facturas.html" class="btn btn-ghost btn-sm">← Volver</a>
      <h1 class="page-title" id="titulo-factura">Factura</h1>
    </div>
    <div class="flex gap-2" id="acciones-header"></div>
  </div>

  <!-- Datos de la factura -->
  <div class="card" id="card-factura">
    <div class="card-title">Datos de la factura</div>
    <dl class="detail-grid" id="detalle-factura">
      <div class="detail-item"><dt>Cargando…</dt><dd></dd></div>
    </dl>
  </div>

  <!-- Pagos registrados -->
  <div class="card">
    <div class="card-title">Cobros registrados</div>
    <ul id="pagos-body" style="list-style:none;padding:0;margin:0"></ul>
  </div>

  <!-- Registrar cobro -->
  <div class="card" id="card-nuevo-pago">
    <div class="card-title">Registrar cobro</div>
    <form id="form-pago" class="form-grid" style="max-width:600px">
      <div class="form-group">
        <label for="pago-fecha">Fecha de cobro</label>
        <input type="date" id="pago-fecha" required>
      </div>
      <div class="form-group">
        <label for="pago-monto">Monto recibido</label>
        <input type="number" id="pago-monto" min="0.01" step="0.01" placeholder="0.00" required>
      </div>
      <div class="form-group">
        <label>Retención de Ganancias</label>
        <div id="retencion-preview" style="padding:8px 0;font-family:monospace;color:var(--text-muted)">—</div>
      </div>
      <div style="grid-column:1/-1">
        <button type="submit" class="btn btn-success" id="btn-guardar-pago">Registrar cobro</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
  const fmt    = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' });
  const params = new URLSearchParams(location.search);
  const factId = params.get('id');

  let facturaActual = null;

  function toast(msg, tipo = 'success') {
    const el = document.createElement('div');
    el.className = `toast toast-${tipo}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function estadoBadge(estado) {
    return estado === 'pagada'
      ? '<span class="badge badge-success">Pagada</span>'
      : '<span class="badge badge-danger">Impaga</span>';
  }

  const fmtUSD = n => `USD ${new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n)}`;
  const fmtARS = n => new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);

  function renderFactura(f) {
    facturaActual = f;
    document.getElementById('titulo-factura').textContent = `Factura ${f.numero}`;

    const esUSD     = f.moneda === 'USD';
    const montoNeto = f.monto_neto ?? (f.monto_total / 1.21);
    const iva       = f.monto_total - montoNeto;
    const fmtMonto  = esUSD ? fmtUSD : fmt.format.bind(fmt);

    const tcARS = esUSD && f.tipo_cambio
      ? `<div class="detail-item"><dt>Tipo de cambio</dt><dd class="font-mono">${fmt.format(f.tipo_cambio)}</dd></div>
         <div class="detail-item"><dt>Equivalente ARS</dt><dd class="font-mono">${fmt.format(f.monto_total * f.tipo_cambio)}</dd></div>`
      : '';

    document.getElementById('detalle-factura').innerHTML = `
      <div class="detail-item"><dt>Número</dt><dd class="font-mono">${f.numero}</dd></div>
      <div class="detail-item"><dt>Tipo</dt><dd>${f.tipo ?? '—'}</dd></div>
      <div class="detail-item"><dt>Cliente</dt><dd>${f.cliente_nombre}</dd></div>
      <div class="detail-item"><dt>CUIT</dt><dd class="font-mono">${f.cliente_cuit ?? '—'}</dd></div>
      <div class="detail-item"><dt>Fecha</dt><dd>${f.fecha}</dd></div>
      <div class="detail-item"><dt>Estado</dt><dd>${estadoBadge(f.estado)}</dd></div>
      <div class="detail-item"><dt>Moneda</dt><dd>${esUSD ? '<span class="badge badge-warning">USD</span>' : 'ARS'}</dd></div>
      <div class="detail-item"><dt>Monto neto</dt><dd class="font-mono">${fmtMonto(montoNeto)}</dd></div>
      <div class="detail-item"><dt>IVA (21%)</dt><dd class="font-mono">${fmtMonto(iva)}</dd></div>
      <div class="detail-item"><dt>Total</dt><dd class="font-mono large">${fmtMonto(f.monto_total)}</dd></div>
      ${tcARS}
    `;

    const acciones  = document.getElementById('acciones-header');
    const nuevoEstado = f.estado === 'pagada' ? 'impaga' : 'pagada';
    const btnLabel  = f.estado === 'pagada' ? 'Marcar como impaga' : 'Marcar como pagada';
    const btnClass  = f.estado === 'pagada' ? 'btn-ghost' : 'btn-success';

    acciones.innerHTML = `
      ${f.pdf_url ? `<a href="${f.pdf_url}" target="_blank" class="btn btn-ghost">Abrir PDF</a>` : ''}
      <button class="btn ${btnClass}" id="btn-cambiar-estado">${btnLabel}</button>
      <button class="btn btn-danger" id="btn-eliminar">Eliminar</button>
    `;

    document.getElementById('btn-cambiar-estado').addEventListener('click', async () => {
      try {
        await API.facturas.estado(factId, nuevoEstado);
        toast(`Factura marcada como ${nuevoEstado}`);
        cargarFactura();
      } catch (e) { toast(e.message, 'error'); }
    });

    document.getElementById('btn-eliminar').addEventListener('click', async () => {
      if (!confirm('¿Eliminar esta factura? Se eliminarán también todos sus cobros registrados.')) return;
      try {
        await API.facturas.delete(factId);
        location.href = 'facturas.html';
      } catch (e) { toast(e.message, 'error'); }
    });
  }

  function renderPagos(pagos) {
    const lista = document.getElementById('pagos-body');

    if (pagos.length === 0) {
      lista.innerHTML = '<li style="padding:1.5rem 0;text-align:center;color:var(--text-muted)">Sin cobros registrados</li>';
      return;
    }

    lista.innerHTML = pagos.map(p => `
      <li data-id="${p.id}" style="display:flex;align-items:center;justify-content:space-between;padding:.6rem 0;border-bottom:1px solid var(--border);gap:.5rem;font-size:.875rem">
        <span style="font-family:ui-monospace,monospace;flex:1">
          ${p.fecha} — ${fmt.format(p.monto)}${p.retencion != null ? ` — Retención: ${fmt.format(p.retencion)}` : ''}
        </span>
        <button class="btn btn-danger btn-sm btn-icon" data-id="${p.id}" title="Eliminar">✕</button>
      </li>
    `).join('');

    lista.querySelectorAll('[data-id] button, button[data-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('¿Eliminar este cobro?')) return;
        try {
          await API.pagos.delete(btn.dataset.id);
          toast('Cobro eliminado');
          cargarPagos();
        } catch (e) { toast(e.message, 'error'); }
      });
    });

  }

  async function cargarFactura() {
    const f = await API.facturas.get(factId);
    renderFactura(f);
  }

  async function cargarPagos() {
    const pagos = await API.pagos.list({ factura_id: factId });
    renderPagos(pagos);
  }

  async function init() {
    if (!factId) {
      document.querySelector('.container').innerHTML =
        '<p class="empty">No se especificó una factura. <a href="facturas.html">Volver al listado</a></p>';
      return;
    }
    try {
      await Promise.all([cargarFactura(), cargarPagos()]);
      document.getElementById('pago-fecha').valueAsDate = new Date();
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  // Actualizar preview de retención mientras el usuario escribe
  document.getElementById('pago-monto').addEventListener('input', () => {
    const montoRecibido = Number(document.getElementById('pago-monto').value);
    const preview = document.getElementById('retencion-preview');
    if (!facturaActual || !montoRecibido) {
      preview.textContent = '—';
      return;
    }
    const retencion = facturaActual.monto_total - montoRecibido;
    preview.textContent = fmt.format(retencion);
    preview.style.color = retencion > 0 ? '#d97706' : 'var(--text-muted)';
  });

  document.getElementById('form-pago').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-guardar-pago');
    btn.disabled = true;
    try {
      await API.pagos.create({
        factura_id: Number(factId),
        fecha: document.getElementById('pago-fecha').value,
        monto: Number(document.getElementById('pago-monto').value),
      });
      toast('Cobro registrado correctamente');
      e.target.reset();
      document.getElementById('pago-fecha').valueAsDate = new Date();
      document.getElementById('retencion-preview').textContent = '—';
      await Promise.all([cargarFactura(), cargarPagos()]);
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  init();
</script>
</body>
</html>
